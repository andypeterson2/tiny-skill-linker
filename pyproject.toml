[project]
name = "tiny-skill-linker"
version = "0.1.0"
description = "Fine-tuning a 22M-parameter sentence embedder for ESCO skill linking, evaluated on public benchmarks and shipped as int8 ONNX"
requires-python = ">=3.12"
license = "MIT"
# torch 2.2.2 is the last build for Intel Macs. workrb declares torch>=2.6, so it
# installs with --no-deps and its own dependencies are listed here alongside this
# project's. requirements.lock is the install path; this list is documentation.
dependencies = [
  "torch==2.2.2",
  "numpy<2",
  "transformers<5",
  "sentence-transformers<6",
  "datasets",
  "onnxruntime",
  "onnx",
  "accelerate",
  "huggingface-hub",
  "appdirs",
  "pandas",
  "pydantic",
  "pyyaml",
  "rank-bm25",
  "rapidfuzz",
  "requests",
  "scikit-learn",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
